<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>講座クーポン | Zunda Lab.</title>
<meta name="description" content="Zunda Lab. の講座を割引の値段で受講できる、いま使えるクーポンの一覧です。">
<link rel="icon" href="logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --zl-green-deep: #0E8C5E;
    --zl-green-mid: #1FB983;
    --zl-green-50: #EEFAF5;
    --ink: #1D1D1F;
    --ink-sub: #5F6368;
    --line: #E5E7EB;
    --bg: #FFFFFF;
    --bg-soft: #F7F8F9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    font-size: 16px;
    line-height: 1.65;
    font-feature-settings: "palt" 1;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }
  header { border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; align-items: center; gap: 12px; height: 64px; }
  header img { width: 32px; height: 32px; }
  header .brand { font-weight: 700; font-size: 16px; }
  .hero { background: linear-gradient(#FFFFFF, var(--zl-green-50)); padding: 48px 0 32px; }
  .hero h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.3; color: var(--zl-green-deep); }
  .hero p { margin: 0; color: var(--ink-sub); }
  main { padding: 32px 0 64px; }
  h2 { font-size: 20px; margin: 0 0 16px; }
  .list { display: grid; gap: 16px; padding: 0; margin: 0; list-style: none; }
  .card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px 24px;
  }
  .card h3 { margin: 0 0 8px; font-size: 17px; line-height: 1.5; }
  .offer {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px 24px;
    align-items: center;
  }
  .offer + .offer { border-top: 1px dashed var(--line); margin-top: 16px; padding-top: 16px; }
  .hint { color: var(--ink-sub); font-size: 13px; margin: 4px 0 0; }
  .meta { color: var(--ink-sub); font-size: 14px; margin: 0; }
  .meta b { color: var(--ink); font-weight: 500; }
  .price { font-size: 24px; font-weight: 700; color: var(--zl-green-deep); white-space: nowrap; }
  .price small { font-size: 14px; font-weight: 500; color: var(--ink-sub); margin-left: 4px; }
  .button {
    display: inline-block;
    background: var(--zl-green-deep);
    color: #FFFFFF;
    text-decoration: none;
    font-weight: 700;
    padding: 12px 20px;
    border-radius: 8px;
    white-space: nowrap;
    text-align: center;
  }
  .button:hover { background: #0B7650; }
  .empty { background: var(--bg-soft); border-radius: 12px; padding: 32px 24px; text-align: center; }
  .empty p { margin: 0 0 16px; }
  .note { color: var(--ink-sub); font-size: 14px; margin-top: 32px; }
  .note p { margin: 0 0 4px; }
  footer { border-top: 1px solid var(--line); padding: 24px 0; color: var(--ink-sub); font-size: 14px; }
  @media (max-width: 600px) {
    .hero { padding: 32px 0 24px; }
    .hero h1 { font-size: 24px; }
    .card { padding: 20px; }
    .offer { grid-template-columns: 1fr; }
    .button { width: 100%; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <img src="logo-mark.png" alt="">
    <span class="brand">Zunda Lab.</span>
  </div>
</header>
<section class="hero">
  <div class="wrap">
    <h1>講座クーポン</h1>
    <p>いま使えるクーポンの一覧です。ボタンを押すと、割引の値段が付いた講座ページが開きます。</p>
  </div>
</section>
<main>
  <div class="wrap">
    <section id="udemy">
      <h2>Udemy の講座</h2>
      <ul class="list" id="udemy-list"></ul>
    </section>
    <div class="note">
      <p>期限はすべて日本時間です。先着の人数に達すると、期限の前でも終わります。</p>
      <p id="updated"></p>
    </div>
  </div>
</main>
<footer>
  <div class="wrap">© 2026 Zunda Lab.</div>
</footer>
<script>
  const PROFILE = "https://www.udemy.com/user/xiao-ye-hong-si/";
  const WEEK = ["日", "月", "火", "水", "木", "金", "土"];

  function jst(iso) {
    const p = Object.fromEntries(new Intl.DateTimeFormat("ja-JP", {
      timeZone: "Asia/Tokyo", year: "numeric", month: "numeric", day: "numeric",
      hour: "numeric", minute: "2-digit", hourCycle: "h23", weekday: "short",
    }).formatToParts(new Date(iso)).map(x => [x.type, x.value]));
    return `${p.month}月${p.day}日（${p.weekday}）${p.hour}:${p.minute}`;
  }

  function yen(price, currency) {
    if (price === 0) return "無料";
    return currency === "JPY" ? `¥${price.toLocaleString("ja-JP")}` : `${price.toLocaleString("ja-JP")} ${currency}`;
  }

  // 先着のもの（無料は人数の記載がなくても先着とみなす）は、使い切られてもページには分からない
  const limited = c => Boolean(c.limit) || c.price === 0;
  // 安いほう（同じなら長く使えるほう）
  const better = (c, b) => !b || c.price < b.price || (c.price === b.price && c.end > b.end);

  // 1 講座につき、先着のいちばん安いもの と 人数の制限なしのいちばん安いもの を選ぶ。
  // 先着のほうが安ければ両方を並べる（使い切られても下の値段で買える）。そうでなければ安いほうだけ
  function pick(coupons, now) {
    const live = coupons.filter(c => new Date(c.start) <= now && now < new Date(c.end));
    const courses = new Map();
    for (const c of live) {
      const slot = courses.get(c.course_id) || { limited: null, open: null };
      const key = limited(c) ? "limited" : "open";
      if (better(c, slot[key])) slot[key] = c;
      courses.set(c.course_id, slot);
    }
    return [...courses.values()].map(({ limited: l, open: o }) => {
      if (l && o) return l.price < o.price ? [l, o] : [o];
      return [l || o];
    });
  }

  function offer(c, next) {
    const div = document.createElement("div");
    div.className = "offer";
    const limit = c.limit ? `・先着 <b>${c.limit} 名</b>` : (c.price === 0 ? "・先着順" : "");
    const hint = next ? `<p class="hint">なくなったら、下の ${yen(next.price, next.currency)} のクーポンをどうぞ</p>` : "";
    div.innerHTML = `
      <div>
        <div class="price">${yen(c.price, c.currency)}<small>クーポン価格</small></div>
        <p class="meta"><b>${jst(c.end)}</b> まで${limit}</p>${hint}
      </div>
      <a class="button" target="_blank" rel="noopener">クーポンで講座を見る</a>`;
    div.querySelector("a").href = c.url;
    return div;
  }

  function card(offers) {
    const li = document.createElement("li");
    li.className = "card";
    const h3 = document.createElement("h3");
    h3.textContent = offers[0].course_name;
    li.append(h3, ...offers.map((c, i) => offer(c, offers[i + 1])));
    return li;
  }

  function empty() {
    const li = document.createElement("li");
    li.className = "empty";
    li.innerHTML = `<p>いま配っているクーポンはありません。</p>
      <a class="button" href="${PROFILE}" target="_blank" rel="noopener">講座の一覧を見る（Udemy）</a>`;
    return li;
  }

  async function main() {
    const list = document.getElementById("udemy-list");
    try {
      const res = await fetch("coupons.json", { cache: "no-store" });
      const data = await res.json();
      const shown = pick(data.coupons.filter(c => c.product === "udemy"), new Date());
      list.replaceChildren(...(shown.length ? shown.map(card) : [empty()]));
      document.getElementById("updated").textContent = `最終更新：${jst(data.updated)}`;
    } catch (e) {
      list.replaceChildren(empty());
    }
  }
  main();
</script>
</body>
</html>
